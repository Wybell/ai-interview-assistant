<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>流式评分测试</title>
  <style>
    body { font-family: monospace; margin: 20px; }
    textarea { width: 100%; margin-bottom: 10px; }
    button { padding: 8px 16px; font-size: 16px; }
    #result { border: 1px solid #ccc; padding: 10px; margin-top: 20px; white-space: pre-wrap; background: #f9f9f9; max-height: 400px; overflow-y: auto; }
  </style>
</head>
<body>
<h2>流式评分测试 (SSE)</h2>
<label>问题：</label><br>
<textarea id="question" rows="3" cols="80">请解释HashMap的put方法流程</textarea><br>
<label>回答：</label><br>
<textarea id="answer" rows="3" cols="80">计算hash，找到桶，如果存在则覆盖</textarea><br>
<button id="startBtn">开始流式评分</button>
<div id="result">等待操作...</div>

<script>
  let eventSource = null;

  document.getElementById('startBtn').addEventListener('click', function() {
    if (eventSource) {
      eventSource.close();
      eventSource = null;
    }

    const question = encodeURIComponent(document.getElementById('question').value);
    const answer = encodeURIComponent(document.getElementById('answer').value);
    const url = `/api/question/score/stream?question=${question}&answer=${answer}`;

    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = '⏳ 等待AI回答...<br>';

    eventSource = new EventSource(url);

    eventSource.onmessage = function(event) {
      // 将每次收到的数据追加到结果区域
      resultDiv.innerHTML += event.data + '<br>';
      // 自动滚动到底部
      resultDiv.scrollTop = resultDiv.scrollHeight;
    };

    eventSource.onerror = function(err) {
      console.error('SSE错误', err);
      resultDiv.innerHTML += '<br><span style="color:red;">❌ 连接关闭或出错</span>';
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
    };
  });
</script>
</body>
</html>
