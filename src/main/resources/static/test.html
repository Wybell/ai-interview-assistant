<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>测试评分</title>
</head>
<body>
<h2>测试评分接口</h2>
<label>知识点：</label><input id="tag" value="HashMap"><br>
<label>问题：</label><textarea id="question" rows="3" cols="50">请描述HashMap的底层实现原理，包括哈希冲突的解决方式以及扩容机制。</textarea><br>
<label>回答：</label><textarea id="answer" rows="3" cols="50">数组加链表加红黑树</textarea><br>
<button onclick="callScore()">提交评分</button>
<div id="result" style="margin-top:20px; border:1px solid #ccc; padding:10px;"></div>

<script>
    async function callScore() {
        const tag = document.getElementById('tag').value;
        const question = document.getElementById('question').value;
        const answer = document.getElementById('answer').value;
        const url = `/api/question/score?tag=${encodeURIComponent(tag)}&question=${encodeURIComponent(question)}&answer=${encodeURIComponent(answer)}`;
        document.getElementById('result').innerText = '请求中...';
        try {
            const res = await fetch(url);
            const text = await res.text();
            document.getElementById('result').innerHTML = `<pre>状态码: ${res.status}\n响应内容: ${text}</pre>`;
        } catch (err) {
            document.getElementById('result').innerText = '错误: ' + err.message;
        }
    }
</script>
</body>
</html>
