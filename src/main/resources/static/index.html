<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AI面试助手 | 智能模拟面试官</title>
    <style>
        /* 样式保持不变，此处省略（请沿用之前的样式） */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(145deg, #f0f4fa 0%, #d9e2ef 100%); font-family: 'Inter', system-ui, sans-serif; padding: 2rem 1.5rem; min-height: 100vh; }
        .container { max-width: 1300px; margin: 0 auto; }
        .app-header { text-align: center; margin-bottom: 2rem; }
        .app-header h1 { font-size: 2.4rem; font-weight: 700; background: linear-gradient(135deg, #1e2b3c, #2c4c6e); background-clip: text; -webkit-background-clip: text; color: transparent; display: inline-flex; align-items: center; gap: 12px; }
        .sub { color: #4a627a; margin-top: 8px; font-weight: 500; background: rgba(255,255,240,0.6); display: inline-block; padding: 4px 16px; border-radius: 40px; font-size: 0.9rem; }
        .tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
        .tab-btn { background: rgba(255,255,255,0.7); backdrop-filter: blur(4px); border: none; padding: 12px 28px; font-size: 1rem; font-weight: 600; border-radius: 60px; cursor: pointer; transition: all 0.25s ease; color: #2c3e50; }
        .tab-btn.active { background: #1f6392; color: white; box-shadow: 0 8px 18px rgba(31,99,146,0.25); transform: translateY(-2px); }
        .panel { background: rgba(255,255,255,0.95); border-radius: 32px; padding: 28px 30px; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2); }
        .form-group { margin-bottom: 1.5rem; }
        label { font-weight: 600; color: #1f3a4b; display: block; margin-bottom: 8px; }
        input, textarea, select { width: 100%; padding: 12px 16px; border-radius: 20px; border: 1px solid #cddfe7; background: white; font-size: 0.95rem; }
        button { background: #1f6392; border: none; color: white; padding: 10px 24px; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-right: 10px; }
        button:hover { background: #0f4b6e; transform: scale(0.98); }
        .score-result { background: #eef3fc; padding: 18px; border-radius: 24px; margin-top: 20px; font-family: monospace; white-space: pre-wrap; max-height: 340px; overflow-y: auto; border-left: 5px solid #1f6392; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { background-color: #e5eff5; padding: 12px; }
        .data-table td { background-color: white; padding: 12px; border-bottom: 1px solid #e2edf2; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 40px; font-size: 0.75rem; font-weight: 600; }
        .badge-low { background: #ffe0db; color: #c23d22; }
        .badge-high { background: #dff3e3; color: #1e7640; }
        .loading { color: #1f6392; font-style: italic; }
        .error { color: #c73e1d; }
    </style>
</head>
<body>
<div class="container">
    <div class="app-header">
        <h1><span>🤖</span> AI面试助手</h1>
        <div class="sub">Java后端实习 · 智能模拟面试官</div>
    </div>
    <div class="tabs">
        <button class="tab-btn active" data-tab="interview">📖 面试练习</button>
        <button class="tab-btn" data-tab="mistakes">📘 错题本</button>
        <button class="tab-btn" data-tab="progress">📊 学习进度</button>
    </div>
    <div id="interviewPanel" class="panel">
        <div class="form-group">
            <label>📌 知识点标签</label>
            <input type="text" id="tagInput" list="tagOptions" placeholder="输入或选择知识点，例如：Redis、高并发..." autocomplete="off">
            <datalist id="tagOptions">
                <option value="HashMap">HashMap</option>
                <option value="线程池">线程池</option>
                <option value="MySQL索引">MySQL索引</option>
                <option value="JVM">JVM</option>
                <option value="Spring事务">Spring事务</option>
                <option value="Redis">Redis</option>
                <option value="消息队列">消息队列</option>
                <option value="Netty">Netty</option>
                <option value="分布式锁">分布式锁</option>
                <option value="高并发">高并发</option>
                <option value="微服务">微服务</option>
            </datalist>
        </div>
        <button id="askBtn">✨ 出题</button>
        <button id="refreshBtn">🔄 换一题</button>
        <div class="qa-area"><label>📄 面试题</label><textarea id="questionText" rows="3" readonly style="background:#f8fafd;"></textarea></div>
        <div class="qa-area"><label>✍️ 你的回答</label><textarea id="answerText" rows="4" placeholder="在这里输入你的回答..."></textarea></div>
        <button id="submitBtn">⚡ 提交并评分 (流式实时输出)</button>
        <div id="scoreResult" class="score-result">评分结果将逐字显示在这里</div>
    </div>
    <div id="mistakesPanel" class="panel" style="display:none;"><h3>📘 错题集 (得分 < 6)</h3><div style="overflow-x: auto;"><table class="data-table" id="mistakesTable"><thead><tr><th>知识点</th><th>面试题</th><th>我的回答</th><th>得分</th><th>标准答案</th><th>改进建议</th></tr></thead><tbody></tbody></table></div></div>
    <div id="progressPanel" class="panel" style="display:none;"><h3>📈 学习进度统计</h3><div style="overflow-x: auto;"><table class="data-table" id="progressTable"><thead><tr><th>知识点</th><th>练习次数</th><th>平均分</th></tr></thead><tbody></tbody></table></div></div>
</div>

<script>
    // 检查登录状态
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = 'login.html';
    }

    // 带 Token 的 fetch
    function authFetch(url, options = {}) {
        const headers = options.headers || {};
        headers['Authorization'] = 'Bearer ' + token;
        return fetch(url, { ...options, headers });
    }

    // DOM 元素
    const tagInput = document.getElementById('tagInput');
    const askBtn = document.getElementById('askBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const questionText = document.getElementById('questionText');
    const answerText = document.getElementById('answerText');
    const submitBtn = document.getElementById('submitBtn');
    const scoreResult = document.getElementById('scoreResult');

    let currentEventSource = null;
    function closeSSE() {
        if (currentEventSource) {
            currentEventSource.close();
            currentEventSource = null;
        }
    }

    // 通用出题函数（refresh 参数控制是否强制刷新）
    async function fetchQuestion(refresh = false) {
        const tag = tagInput.value.trim();
        if (!tag) {
            alert('请输入或选择一个知识点');
            return;
        }
        try {
            const url = `/api/question/ask?tag=${encodeURIComponent(tag)}&refresh=${refresh}`;
            const res = await authFetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const question = await res.text();
            questionText.value = question;
            answerText.value = '';
            scoreResult.innerHTML = '评分结果将显示在这里';
        } catch (err) {
            alert('出题失败：' + err.message);
        }
    }

    // 普通出题（优先使用缓存）
    askBtn.addEventListener('click', () => {
        closeSSE();
        fetchQuestion(false);
    });

    // 换一题（强制调用 AI，刷新缓存）
    refreshBtn.addEventListener('click', () => {
        closeSSE();
        fetchQuestion(true);
    });

    // 流式评分
    async function submitScoreStream() {
        const tag = tagInput.value.trim();
        const question = questionText.value;
        const answer = answerText.value;
        if (!tag) {
            alert('请输入知识点');
            return;
        }
        if (!question) { alert('请先出题'); return; }
        if (!answer) { alert('请输入你的回答'); return; }

        closeSSE();
        scoreResult.innerHTML = '<span class="loading">⏳ AI 正在思考评分，实时输出中...</span><br>';
        submitBtn.disabled = true;
        setTimeout(() => { submitBtn.disabled = false; }, 800);

        const url = `/api/question/score/stream?tag=${encodeURIComponent(tag)}&question=${encodeURIComponent(question)}&answer=${encodeURIComponent(answer)}&token=${encodeURIComponent(token)}`;
        const eventSource = new EventSource(url);
        currentEventSource = eventSource;

        let fullText = '';
        eventSource.onmessage = (event) => {
            fullText += event.data;
            scoreResult.innerHTML = fullText.replace(/\n/g, '<br>');
            scoreResult.scrollTop = scoreResult.scrollHeight;
        };
        eventSource.onerror = (err) => {
            console.error('SSE 错误', err);
            if (fullText === '') scoreResult.innerHTML = '<span class="error">❌ 连接失败，请稍后重试</span>';
            closeSSE();
            const activeTab = document.querySelector('.tab-btn.active').getAttribute('data-tab');
            if (activeTab === 'mistakes') loadMistakes();
            if (activeTab === 'progress') loadProgress();
        };
    }

    submitBtn.addEventListener('click', submitScoreStream);

    // 错题本
    async function loadMistakes() {
        try {
            const res = await authFetch('/api/mistakes');
            if (!res.ok) throw new Error();
            const data = await res.json();
            const tbody = document.querySelector('#mistakesTable tbody');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">✨ 暂无错题，继续加油</td></tr>';
                return;
            }
            data.forEach(item => {
                const row = tbody.insertRow();
                row.insertCell(0).innerText = item.tag;
                row.insertCell(1).innerText = item.question;
                row.insertCell(2).innerText = item.userAnswer;
                row.insertCell(3).innerHTML = `<span class="badge badge-low">${item.score}</span>`;
                row.insertCell(4).innerText = item.correctAnswer || '—';
                row.insertCell(5).innerText = item.suggestion || '—';
            });
        } catch (err) { console.error(err); }
    }

    // 学习进度
    async function loadProgress() {
        try {
            const res = await authFetch('/api/progress');
            if (!res.ok) throw new Error();
            const data = await res.json();
            const tbody = document.querySelector('#progressTable tbody');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">暂无数据，请先练习</td></table>';
                return;
            }
            data.forEach(item => {
                const row = tbody.insertRow();
                row.insertCell(0).innerText = item.tag;
                row.insertCell(1).innerText = item.totalCount;
                const avg = item.avgScore ? parseFloat(item.avgScore).toFixed(1) : '0.0';
                row.insertCell(2).innerHTML = `<span class="badge badge-high">${avg}</span>`;
            });
        } catch (err) { console.error(err); }
    }

    // 选项卡切换
    function initTabs() {
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                tabs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.getAttribute('data-tab');
                document.getElementById('interviewPanel').style.display = tab === 'interview' ? 'block' : 'none';
                document.getElementById('mistakesPanel').style.display = tab === 'mistakes' ? 'block' : 'none';
                document.getElementById('progressPanel').style.display = tab === 'progress' ? 'block' : 'none';
                if (tab === 'mistakes') loadMistakes();
                if (tab === 'progress') loadProgress();
                if (tab !== 'interview') closeSSE();
            });
        });
    }

    window.addEventListener('beforeunload', () => closeSSE());

    // 初始化
    initTabs();
    fetchQuestion(false);
    loadMistakes();
    loadProgress();
</script>
</body>
</html>
