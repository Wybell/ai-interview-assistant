# ????????????????? 8082?
server.port=${SERVER_PORT:8082}

# MySQL ?????????? MySQL???? localhost ?? MySQL ???????????
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

# Redis ??
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=${REDIS_TIMEOUT:2000ms}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:86400000}

# Provider/model selection is managed by the database allowlist and user preference.
app.ai.dashscope-api-key=${DASHSCOPE_API_KEY:}
app.ai.dashscope-endpoint=${DASHSCOPE_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation}
# Set the full Responses API URL supplied by the relay.
app.ai.change2pro-api-key=${CHANGE2PRO_API_KEY:}
app.ai.change2pro-endpoint=${CHANGE2PRO_ENDPOINT:}
app.ai.change2pro-reasoning-effort=${CHANGE2PRO_REASONING_EFFORT:low}
app.ai.change2pro-disable-response-storage=${CHANGE2PRO_DISABLE_RESPONSE_STORAGE:true}
# DeepSeek uses the OpenAI-compatible Chat Completions API.
app.ai.deepseek-api-key=${DEEPSEEK_API_KEY:}
app.ai.deepseek-endpoint=${DEEPSEEK_ENDPOINT:https://api.deepseek.com/chat/completions}

# MyBatis-Plus ??
mybatis-plus.mapper-locations=classpath:/mapper/*.xml
mybatis-plus.type-aliases-package=com.example.aiinterviewassistant.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
