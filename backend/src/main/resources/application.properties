spring.application.name=ai-interview-assistant
server.port=8082
# MySQL
# Local MySQL 8 uses caching_sha2_password when SSL is disabled.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/interview_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway
# Migrations are enabled only after the target database is intentionally prepared.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath:/mapper/*.xml
mybatis-plus.type-aliases-package=com.example.aiinterviewassistant.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true

# Redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=${REDIS_TIMEOUT:2000ms}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:86400000}

# AI provider connection settings. Selectable provider/model pairs are managed by
# the database allowlist and the authenticated user's persisted preference.
app.ai.dashscope-api-key=${DASHSCOPE_API_KEY:}
app.ai.dashscope-endpoint=${DASHSCOPE_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation}
# Set the full Responses API URL supplied by the relay, for example:
# https://api.change2pro.com/v1/responses or https://api.change2pro.com/responses.
app.ai.change2pro-api-key=${CHANGE2PRO_API_KEY:}
app.ai.change2pro-endpoint=${CHANGE2PRO_ENDPOINT:}
app.ai.change2pro-reasoning-effort=${CHANGE2PRO_REASONING_EFFORT:low}
app.ai.change2pro-disable-response-storage=${CHANGE2PRO_DISABLE_RESPONSE_STORAGE:true}
# DeepSeek uses the OpenAI-compatible Chat Completions API.
app.ai.deepseek-api-key=${DEEPSEEK_API_KEY:}
app.ai.deepseek-endpoint=${DEEPSEEK_ENDPOINT:https://api.deepseek.com/chat/completions}

# SSE scoring sessions are bounded so disconnected clients do not retain work indefinitely.
app.sse.score-timeout-millis=${SSE_SCORE_TIMEOUT_MILLIS:45000}
