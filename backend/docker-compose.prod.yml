services:
  mysql:
    image: mysql:8.0
    container_name: ai-interview-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: ai-interview-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-interview-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - /opt/ai-interview/config/application-prod.properties:/app/config/application-prod.properties:ro
      - /opt/ai-interview/uploads/resumes:/opt/ai-interview/uploads/resumes
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application-prod.properties
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/interview_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      CUSTOM_AI_API_KEY: ${CUSTOM_AI_API_KEY:-}
      CUSTOM_AI_ENDPOINT: ${CUSTOM_AI_ENDPOINT:-}
      CUSTOM_AI_REASONING_EFFORT: ${CUSTOM_AI_REASONING_EFFORT:-high}
      CUSTOM_AI_DISABLE_RESPONSE_STORAGE: ${CUSTOM_AI_DISABLE_RESPONSE_STORAGE:-true}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ai-interview-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT}:80"

volumes:
  mysql-data:
  redis-data:
